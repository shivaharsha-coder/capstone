services:
  # Python FastAPI + AI Models Backend
  - type: web
    name: smart-classroom-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000

  # React Frontend (Alternative to Vercel)
  - type: web
    name: smart-classroom-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
